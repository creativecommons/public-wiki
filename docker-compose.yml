# https://docs.docker.com/compose/compose-file/
name: public-wiki

services:

  web:
    container_name: web
    build:
      context: .
      dockerfile: web.Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    init: true
    links:
      - db
    ports:
      - '8080:80'
    restart: on-failure
    volumes:
      # MediaWiki volume
      - volume-wiki:/mnt/wiki
      # Pull cache (read-only)
      - ./cache/pull:/mnt/pull:ro
      # Export cache
      - ./cache/export:/mnt/export

  db:
    container_name: db
    build:
      args:
        - MYSQL_DATABASE
      context: .
      dockerfile: db.Dockerfile
      secrets:
        - MYSQL_ROOT_PASSWORD
    env_file:
      - .env
      - config/db_env_clear
    restart: on-failure
    volumes:
      # Configuration (read-only)
      - ../config/db.cnf:/etc/mysql/conf.d/db.cnf:ro
      # Data
      - volume-mysql:/var/lib/mysql
      # Pull cache (read-only)
      - ./cache/pull:/mnt/pull:ro
      # Export cache
      - ./cache/export:/mnt/export


secrets:
  MYSQL_ROOT_PASSWORD:
    environment: MYSQL_ROOT_PASSWORD

volumes:
  volume-mysql:
  volume-wiki:
